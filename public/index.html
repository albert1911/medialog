<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Medialog</title>
  <meta name="description" content="Track the anime, shows, movies, books and games you consume. Works offline.">
  <meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1622" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <header class="topbar">
    <button type="button" class="btn btn-ghost back-btn" id="back-btn" aria-label="Back" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        style="width: 16px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
      </svg>
      <span>Back</span>
    </button>
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="38" height="38"><span>Medialog</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="library">Library</a>
      <a href="#/sources" data-nav="sources">Sources</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <a href="#/settings" class="btn btn-warning sync-btn" title="Sync needs attention">⚠ Sync</a>
      <a href="#/settings" class="btn btn-warning backup-btn" id="backup-btn" title="Auto-backup needs attention">⚠
        Backup</a>
      <button type="button" class="btn btn-secondary install-btn" id="install-btn">Install</button>
      <a href="#/entries/new" class="btn btn-primary">+ Add</a>
    </div>
  </header>
  <main id="view" class="container"></main>
  <div id="toasts" aria-live="polite"></div>
</body>

</html>
