<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Medialog</title>
  <meta name="description" content="Track the anime, shows, movies, books and games you consume. Works offline.">
  <meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1622" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Medialog</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="library">Library</a>
      <a href="#/sources" data-nav="sources">Sources</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <a href="#/settings" class="btn btn-ghost sync-btn" title="Sync needs attention">⚠ Sync</a>
      <a href="#/settings" class="btn btn-ghost backup-btn" id="backup-btn" title="Auto-backup needs attention">⚠ Backup</a>
      <button type="button" class="btn btn-ghost install-btn" id="install-btn">Install</button>
      <a href="#/entries/new" class="btn btn-primary">+ Add</a>
    </div>
  </header>
  <main id="view" class="container"></main>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
